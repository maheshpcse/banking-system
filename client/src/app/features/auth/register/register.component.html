<section class="auth-shell" *ngIf="!loading; else authShimmer">
  <div class="auth-visual auth-visual--alt" aria-hidden="true">
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <div class="stack-card">
      <span>Starter balance</span>
      <strong>$1,000 ready when you join.</strong>
    </div>
  </div>

  <app-animated-card class="auth-panel" title="Open your account" subtitle="Register" accent="mint">
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Full name</span>
        <input type="text" formControlName="fullName" autocomplete="name" placeholder="Alex Rivera" />
      </label>
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@email.com" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="new-password" placeholder="Min. 6 characters" />
      </label>

      <button class="btn btn--primary" type="submit" [disabled]="loading">
        Create account
      </button>
    </form>

    <p class="auth-switch">
      Already banking with us?
      <a routerLink="/auth/login">Sign in</a>
    </p>
  </app-animated-card>
</section>

<ng-template #authShimmer>
  <app-shimmer variant="auth"></app-shimmer>
</ng-template>
