<section class="auth-shell">
  <div class="auth-visual" aria-hidden="true">
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <div class="stack-card">
      <span>Instant transfers</span>
      <strong>Clear balances. Calm banking.</strong>
    </div>
  </div>

  <app-animated-card class="auth-panel" title="Welcome back" subtitle="Sign in" accent="sky">
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@email.com" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      <p class="form__error" *ngIf="error">{{ error }}</p>

      <button class="btn btn--primary" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch">
      New here?
      <a routerLink="/auth/register">Create an account</a>
    </p>
  </app-animated-card>
</section>
