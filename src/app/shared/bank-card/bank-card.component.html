<div class="bank-card" [class.is-flipped]="flipped" aria-label="NovaBank card preview">
  <div class="bank-card__inner">
    <div class="bank-card__face bank-card__face--front">
      <div class="bank-card__top">
        <span class="bank-card__brand">{{ brand }}</span>
        <span class="bank-card__chip" aria-hidden="true"></span>
      </div>
      <p class="bank-card__number">{{ displayNumber }}</p>
      <div class="bank-card__meta">
        <div>
          <span>Card holder</span>
          <strong>{{ displayName }}</strong>
        </div>
        <div>
          <span>Expires</span>
          <strong>{{ displayExpiry }}</strong>
        </div>
      </div>
    </div>
    <div class="bank-card__face bank-card__face--back">
      <div class="bank-card__stripe" aria-hidden="true"></div>
      <div class="bank-card__cvv-panel">
        <span>CVV</span>
        <strong>{{ displayCvv }}</strong>
      </div>
      <p class="bank-card__back-note">Authorized signature panel · NovaBank secure card</p>
    </div>
  </div>
</div>
