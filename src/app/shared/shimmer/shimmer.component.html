<div class="shimmer" [ngClass]="'shimmer--' + variant" aria-busy="true" aria-live="polite">
  <ng-container [ngSwitch]="variant">
    <ng-container *ngSwitchCase="'dashboard'">
      <div class="shimmer__hero shimmer__hero--dashboard">
        <div class="shimmer__hero-copy">
          <div class="shimmer-line shimmer-line--brand"></div>
          <div class="shimmer-line shimmer-line--title"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
        </div>
        <div class="shimmer-hero-chip" aria-hidden="true">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
        </div>
      </div>
      <div class="shimmer__grid">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--xl"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--sm"></div>
        </div>
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </div>
      <div class="shimmer-card">
        <div class="shimmer-line shimmer-line--xs"></div>
        <div class="shimmer-line shimmer-line--md"></div>
        <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'history'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer-chips">
        <span *ngFor="let i of [1, 2, 3, 4, 5]" class="shimmer-chip"></span>
      </div>
      <div class="shimmer-card">
        <header class="shimmer-ledger__header">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
        </header>
        <div class="shimmer-tx-item" *ngFor="let i of [1, 2, 3, 4]">
          <div class="shimmer-tx-item__main">
            <div class="shimmer-line shimmer-line--sm"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
          </div>
          <div class="shimmer-tx-item__side">
            <div class="shimmer-line shimmer-line--sm"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'history-ledger'">
      <div class="shimmer-card shimmer-card--ledger">
        <header class="shimmer-ledger__header">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
        </header>
        <div class="shimmer-tx-item" *ngFor="let i of [1, 2, 3]">
          <div class="shimmer-tx-item__main">
            <div class="shimmer-line shimmer-line--sm"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
          </div>
          <div class="shimmer-tx-item__side">
            <div class="shimmer-line shimmer-line--sm"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'tx-timeline'">
      <div class="shimmer-tx shimmer-tx--timeline" aria-hidden="true">
        <div class="shimmer-tx-timeline__item" *ngFor="let i of [1, 2, 3, 4, 5]">
          <span class="shimmer-tx-timeline__dot"></span>
          <div class="shimmer-tx-timeline__copy">
            <div class="shimmer-line shimmer-line--md"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'tx-chart'">
      <div class="shimmer-tx shimmer-tx--chart" aria-hidden="true">
        <div class="shimmer-tx-chart__row" *ngFor="let i of [1, 2, 3, 4]">
          <div class="shimmer-line shimmer-line--xs shimmer-tx-chart__label"></div>
          <div class="shimmer-tx-chart__track">
            <span class="shimmer-tx-chart__bar" [style.width.%]="barWidths[i - 1]"></span>
          </div>
          <div class="shimmer-line shimmer-line--xs shimmer-tx-chart__value"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'tx-table'">
      <div class="shimmer-tx shimmer-tx--table" aria-hidden="true">
        <div class="shimmer-tx-table__head">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
        </div>
        <div class="shimmer-tx-table__row" *ngFor="let i of [1, 2, 3, 4, 5, 6]">
          <div class="shimmer-line shimmer-line--sm"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'form'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--form">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'transfer'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--form">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
        <div class="shimmer-card shimmer-card--tips">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'settings'">
      <div class="shimmer__hero shimmer__hero--settings">
        <div class="shimmer__hero-copy">
          <div class="shimmer-line shimmer-line--brand"></div>
          <div class="shimmer-line shimmer-line--title"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
        </div>
        <div class="shimmer-avatar" aria-hidden="true"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--settings">
        <div class="shimmer-card shimmer-card--nav">
          <div class="shimmer-line shimmer-line--md" *ngFor="let i of [1, 2, 3, 4, 5, 6]"></div>
        </div>
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'settings-panel'">
      <ng-container [ngSwitch]="panel">
        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'identity'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-cardinfo-row shimmer-cardinfo-row--2">
            <div class="shimmer-block shimmer-block--sm"></div>
            <div class="shimmer-block shimmer-block--sm"></div>
          </div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'presence'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-avatar shimmer-avatar--lg"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-chips">
            <span class="shimmer-chip" *ngFor="let i of [1, 2, 3, 4, 5]"></span>
          </div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'banking'">
          <div class="shimmer-panel-head">
            <div class="shimmer-panel-head__copy">
              <div class="shimmer-line shimmer-line--xs"></div>
              <div class="shimmer-line shimmer-line--md"></div>
            </div>
            <span class="shimmer-chip shimmer-chip--badge"></span>
          </div>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-step" *ngFor="let i of [1, 2, 3, 4, 5]">
            <div class="shimmer-line shimmer-line--sm"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
          </div>
          <div class="shimmer-line shimmer-line--btn shimmer-line--btn-inline"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'cardinfo'">
          <div class="shimmer-panel-head">
            <div class="shimmer-panel-head__copy">
              <div class="shimmer-line shimmer-line--xs"></div>
              <div class="shimmer-line shimmer-line--md"></div>
            </div>
          </div>
          <div class="shimmer__grid shimmer__grid--cardinfo">
            <div class="shimmer-cardinfo-preview">
              <div class="shimmer-block shimmer-block--card"></div>
              <div class="shimmer-block shimmer-block--issued"></div>
            </div>
            <div class="shimmer-cardinfo-fields">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-block"></div>
              <div class="shimmer-block"></div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--3">
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
              </div>
            </div>
            <div class="shimmer-cardinfo-address">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-block"></div>
              <div class="shimmer-block shimmer-block--sm"></div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--2">
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
              </div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--2">
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
              </div>
            </div>
            <div class="shimmer-cardinfo-validity">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--2">
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
              </div>
            </div>
            <div class="shimmer-line shimmer-line--btn shimmer-cardinfo-submit"></div>
          </div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'limits'">
          <div class="shimmer-panel-head">
            <div class="shimmer-panel-head__copy">
              <div class="shimmer-line shimmer-line--xs"></div>
              <div class="shimmer-line shimmer-line--md"></div>
            </div>
          </div>
          <div class="shimmer-limits">
            <div class="shimmer-limits__section">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-line shimmer-line--lede"></div>
              <div class="shimmer-limits__currency">
                <div class="shimmer-block"></div>
                <div class="shimmer-line shimmer-line--btn shimmer-line--btn-inline"></div>
              </div>
            </div>
            <div class="shimmer-limits__section">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-limits__caps">
                <div class="shimmer-block shimmer-block--sm" *ngFor="let i of [1, 2, 3, 4]"></div>
              </div>
              <div class="shimmer-line shimmer-line--lede"></div>
            </div>
            <div class="shimmer-limits__section">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--2">
                <div class="shimmer-block"></div>
                <div class="shimmer-block"></div>
                <div class="shimmer-block"></div>
                <div class="shimmer-block"></div>
              </div>
              <div class="shimmer-line shimmer-line--btn"></div>
            </div>
          </div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'security'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'experience'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-row shimmer-row--pref" *ngFor="let i of [1, 2, 3, 4]"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-theme-grid">
            <span class="shimmer-theme-tile" *ngFor="let i of [1, 2, 3, 4, 5, 6]"></span>
          </div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn shimmer-line--btn-inline"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchDefault>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </ng-container>
    </ng-container>

    <ng-container *ngSwitchCase="'notifications'">
      <div class="shimmer__hero shimmer__hero--alerts">
        <div class="shimmer__hero-copy">
          <div class="shimmer-line shimmer-line--brand"></div>
          <div class="shimmer-line shimmer-line--title"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
        </div>
        <div class="shimmer-tools">
          <span class="shimmer-chip shimmer-chip--tool" *ngFor="let i of [1, 2, 3, 4]"></span>
        </div>
      </div>
      <div class="shimmer-chips">
        <span *ngFor="let i of [1, 2, 3, 4, 5]" class="shimmer-chip"></span>
      </div>
      <div class="shimmer-notif" *ngFor="let i of [1, 2, 3, 4]">
        <div class="shimmer-notif__icon"></div>
        <div class="shimmer-notif__body">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'notifications-list'">
      <div class="shimmer-notif" *ngFor="let i of [1, 2, 3]">
        <div class="shimmer-notif__icon"></div>
        <div class="shimmer-notif__body">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'notifications-grid'">
      <div class="shimmer-notif-grid">
        <div class="shimmer-notif" *ngFor="let i of [1, 2, 3, 4]">
          <div class="shimmer-notif__icon"></div>
          <div class="shimmer-notif__body">
            <div class="shimmer-line shimmer-line--md"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-overview'">
      <div class="shimmer__hero shimmer__hero--admin">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--admin-stats">
        <div class="shimmer-card shimmer-card--stat" *ngFor="let i of [1, 2, 3, 4, 5, 6]">
          <div class="shimmer-notif__icon"></div>
          <div class="shimmer-stat-copy">
            <div class="shimmer-line shimmer-line--xs"></div>
            <div class="shimmer-line shimmer-line--sm"></div>
          </div>
        </div>
      </div>
      <div class="shimmer-line shimmer-line--lede shimmer-line--admin-hint"></div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-customers'">
      <div class="shimmer__hero shimmer__hero--admin">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer-data-table" aria-hidden="true">
        <div class="shimmer-data-table__head" style="grid-template-columns: repeat(6, minmax(0, 1fr))">
          <div class="shimmer-data-table__cell" *ngFor="let c of [0, 1, 2, 3, 4, 5]">
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
        <div
          class="shimmer-data-table__row"
          *ngFor="let r of [1, 2, 3, 4, 5, 6]"
          style="grid-template-columns: repeat(6, minmax(0, 1fr))"
        >
          <div class="shimmer-data-table__cell" *ngFor="let c of [0, 1, 2, 3, 4, 5]">
            <div
              class="shimmer-line"
              [class.shimmer-line--sm]="c === 0"
              [class.shimmer-line--xs]="c !== 0"
            ></div>
            <div class="shimmer-line shimmer-line--xs" *ngIf="c === 0"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-customers-table'">
      <div class="shimmer-data-table" aria-hidden="true">
        <div class="shimmer-data-table__head" [style.gridTemplateColumns]="tableGridTemplate">
          <div class="shimmer-data-table__cell" *ngFor="let c of columnIndexes">
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
        <div
          class="shimmer-data-table__row"
          *ngFor="let r of rowIndexes"
          [style.gridTemplateColumns]="tableGridTemplate"
        >
          <div class="shimmer-data-table__cell" *ngFor="let c of columnIndexes">
            <div
              class="shimmer-line"
              [class.shimmer-line--sm]="c === 0"
              [class.shimmer-line--xs]="c !== 0"
            ></div>
            <div class="shimmer-line shimmer-line--xs" *ngIf="c === 0"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'data-table'">
      <div class="shimmer-data-table" aria-hidden="true">
        <div class="shimmer-data-table__head" [style.gridTemplateColumns]="tableGridTemplate">
          <div class="shimmer-data-table__cell" *ngFor="let c of columnIndexes">
            <div class="shimmer-line shimmer-line--xs"></div>
          </div>
        </div>
        <div
          class="shimmer-data-table__row"
          *ngFor="let r of rowIndexes"
          [style.gridTemplateColumns]="tableGridTemplate"
        >
          <div class="shimmer-data-table__cell" *ngFor="let c of columnIndexes">
            <div
              class="shimmer-line"
              [class.shimmer-line--sm]="c === 0"
              [class.shimmer-line--xs]="c !== 0"
            ></div>
            <div class="shimmer-line shimmer-line--xs" *ngIf="c === 0"></div>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-requests'">
      <div class="shimmer__hero shimmer__hero--admin">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer-chips">
        <span *ngFor="let i of [1, 2, 3, 4, 5, 6]" class="shimmer-chip"></span>
      </div>
      <div class="shimmer-request-list">
        <div class="shimmer-card shimmer-card--request" *ngFor="let i of [1, 2, 3]">
          <div class="shimmer-request-copy">
            <div class="shimmer-line shimmer-line--md"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
            <span class="shimmer-chip shimmer-chip--pill"></span>
          </div>
          <div class="shimmer-request-actions">
            <span class="shimmer-chip shimmer-chip--action"></span>
            <span class="shimmer-chip shimmer-chip--action"></span>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-requests-list'">
      <div class="shimmer-request-list">
        <div class="shimmer-card shimmer-card--request" *ngFor="let i of [1, 2, 3]">
          <div class="shimmer-request-copy">
            <div class="shimmer-line shimmer-line--md"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
            <div class="shimmer-line shimmer-line--xs"></div>
            <span class="shimmer-chip shimmer-chip--pill"></span>
          </div>
          <div class="shimmer-request-actions">
            <span class="shimmer-chip shimmer-chip--action"></span>
            <span class="shimmer-chip shimmer-chip--action"></span>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'manager-overview'">
      <div class="shimmer__hero shimmer__hero--admin">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
