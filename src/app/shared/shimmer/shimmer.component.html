<div class="shimmer" [ngClass]="'shimmer--' + variant" aria-busy="true" aria-live="polite">
  <ng-container [ngSwitch]="variant">
    <ng-container *ngSwitchCase="'dashboard'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--xl"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--sm"></div>
        </div>
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </div>
      <div class="shimmer-card">
        <div class="shimmer-line shimmer-line--xs"></div>
        <div class="shimmer-line shimmer-line--md"></div>
        <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'history'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer-chips">
        <span *ngFor="let i of [1, 2, 3, 4, 5]" class="shimmer-chip"></span>
      </div>
      <div class="shimmer-card">
        <div class="shimmer-line shimmer-line--xs"></div>
        <div class="shimmer-line shimmer-line--md"></div>
        <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'history-ledger'">
      <div class="shimmer-card shimmer-card--ledger">
        <div class="shimmer-line shimmer-line--xs"></div>
        <div class="shimmer-line shimmer-line--md"></div>
        <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'form'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--form">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'transfer'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--form">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
        <div class="shimmer-card shimmer-card--tips">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-row" *ngFor="let i of [1, 2, 3]"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'settings'">
      <div class="shimmer__hero shimmer__hero--settings">
        <div class="shimmer__hero-copy">
          <div class="shimmer-line shimmer-line--brand"></div>
          <div class="shimmer-line shimmer-line--title"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
        </div>
        <div class="shimmer-avatar" aria-hidden="true"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--settings">
        <div class="shimmer-card shimmer-card--nav">
          <div class="shimmer-line shimmer-line--md" *ngFor="let i of [1, 2, 3, 4, 5, 6]"></div>
        </div>
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'settings-panel'">
      <ng-container [ngSwitch]="panel">
        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'presence'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-avatar shimmer-avatar--lg"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-chips">
            <span class="shimmer-chip" *ngFor="let i of [1, 2, 3, 4, 5]"></span>
          </div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'banking'">
          <div class="shimmer-panel-head">
            <div class="shimmer-panel-head__copy">
              <div class="shimmer-line shimmer-line--xs"></div>
              <div class="shimmer-line shimmer-line--md"></div>
            </div>
            <span class="shimmer-chip shimmer-chip--badge"></span>
          </div>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-step" *ngFor="let i of [1, 2, 3, 4, 5]">
            <div class="shimmer-line shimmer-line--sm"></div>
            <div class="shimmer-line shimmer-line--lede"></div>
          </div>
          <div class="shimmer-line shimmer-line--btn shimmer-line--btn-inline"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'cardinfo'">
          <div class="shimmer-panel-head">
            <div class="shimmer-panel-head__copy">
              <div class="shimmer-line shimmer-line--xs"></div>
              <div class="shimmer-line shimmer-line--md"></div>
            </div>
          </div>
          <div class="shimmer__grid shimmer__grid--cardinfo">
            <div class="shimmer-cardinfo-preview">
              <div class="shimmer-block shimmer-block--card"></div>
              <div class="shimmer-block shimmer-block--issued"></div>
            </div>
            <div class="shimmer-cardinfo-fields">
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-block"></div>
              <div class="shimmer-block"></div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--3">
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
              </div>
              <div class="shimmer-line shimmer-line--sm"></div>
              <div class="shimmer-block"></div>
              <div class="shimmer-block shimmer-block--sm"></div>
              <div class="shimmer-cardinfo-row shimmer-cardinfo-row--2">
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
                <div class="shimmer-block shimmer-block--sm"></div>
              </div>
              <div class="shimmer-line shimmer-line--btn"></div>
            </div>
          </div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'security'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchCase="'experience'">
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-row shimmer-row--pref" *ngFor="let i of [1, 2, 3, 4]"></div>
          <div class="shimmer-line shimmer-line--btn shimmer-line--btn-inline"></div>
        </div>

        <div class="shimmer-card shimmer-card--settings-panel" *ngSwitchDefault>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block shimmer-block--sm"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </ng-container>
    </ng-container>

    <ng-container *ngSwitchCase="'notifications'">
      <div class="shimmer__hero shimmer__hero--alerts">
        <div class="shimmer__hero-copy">
          <div class="shimmer-line shimmer-line--brand"></div>
          <div class="shimmer-line shimmer-line--title"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
        </div>
        <div class="shimmer-tools">
          <span class="shimmer-chip shimmer-chip--tool" *ngFor="let i of [1, 2, 3, 4]"></span>
        </div>
      </div>
      <div class="shimmer-chips">
        <span *ngFor="let i of [1, 2, 3, 4, 5]" class="shimmer-chip"></span>
      </div>
      <div class="shimmer-notif" *ngFor="let i of [1, 2, 3, 4]">
        <div class="shimmer-notif__icon"></div>
        <div class="shimmer-notif__body">
          <div class="shimmer-line shimmer-line--md"></div>
          <div class="shimmer-line shimmer-line--lede"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-overview'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer__grid shimmer__grid--admin-stats">
        <div class="shimmer-card shimmer-card--stat" *ngFor="let i of [1, 2, 3, 4]">
          <div class="shimmer-notif__icon"></div>
          <div class="shimmer-line shimmer-line--xs"></div>
          <div class="shimmer-line shimmer-line--md"></div>
        </div>
      </div>
      <div class="shimmer-line shimmer-line--lede"></div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-customers'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer-card shimmer-card--table">
        <div class="shimmer-row" *ngFor="let i of [1, 2, 3, 4, 5]"></div>
      </div>
    </ng-container>

    <ng-container *ngSwitchCase="'admin-requests'">
      <div class="shimmer__hero">
        <div class="shimmer-line shimmer-line--brand"></div>
        <div class="shimmer-line shimmer-line--title"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
      </div>
      <div class="shimmer-card shimmer-card--request" *ngFor="let i of [1, 2, 3]">
        <div class="shimmer-line shimmer-line--md"></div>
        <div class="shimmer-line shimmer-line--lede"></div>
        <div class="shimmer-line shimmer-line--xs"></div>
      </div>
    </ng-container>

    <ng-container *ngSwitchDefault>
      <div class="shimmer__auth">
        <div class="shimmer-card">
          <div class="shimmer-line shimmer-line--brand"></div>
          <div class="shimmer-line shimmer-line--title"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-block"></div>
          <div class="shimmer-line shimmer-line--btn"></div>
        </div>
      </div>
    </ng-container>
  </ng-container>
</div>
