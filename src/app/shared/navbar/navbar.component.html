<header class="nav" *ngIf="auth.isAuthenticated()">
  <div class="nav__inner">
    <a [routerLink]="homeLink" class="brand" (click)="onNavClick()">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">NovaBank</span>
    </a>

    <button class="nav__toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen">
      Menu
    </button>

    <nav class="nav__links" [class.is-open]="menuOpen">
      <ng-container *ngIf="!isStaff">
        <a routerLink="/dashboard" routerLinkActive="is-active" (click)="onNavClick()">Dashboard</a>
        <a routerLink="/transfer" routerLinkActive="is-active" (click)="onNavClick()">Transfer</a>
        <a routerLink="/transactions" routerLinkActive="is-active" (click)="onNavClick()">History</a>
      </ng-container>
      <ng-container *ngIf="isAdmin">
        <a
          routerLink="/admin"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavClick()"
        >Operations</a>
        <a routerLink="/admin/customers" routerLinkActive="is-active" (click)="onNavClick()">Customers</a>
        <a routerLink="/admin/requests" routerLinkActive="is-active" (click)="onNavClick()">Requests</a>
        <a
          *ngIf="isSuperAdmin"
          routerLink="/admin/staff"
          routerLinkActive="is-active"
          (click)="onNavClick()"
        >Staff</a>
      </ng-container>
      <ng-container *ngIf="isManager">
        <a
          routerLink="/manager"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="onNavClick()"
        >Desk</a>
        <a routerLink="/manager/customers" routerLinkActive="is-active" (click)="onNavClick()">Customers</a>
        <a routerLink="/manager/approvals" routerLinkActive="is-active" (click)="onNavClick()">Approvals</a>
        <a routerLink="/manager/limits" routerLinkActive="is-active" (click)="onNavClick()">Limits</a>
        <a routerLink="/manager/reports" routerLinkActive="is-active" (click)="onNavClick()">Reports</a>
        <a routerLink="/manager/billing" routerLinkActive="is-active" (click)="onNavClick()">Billing</a>
      </ng-container>
      <a routerLink="/notifications" routerLinkActive="is-active" class="nav__bell" (click)="onNavClick()">
        Alerts
        <span class="nav__badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </a>
      <a routerLink="/settings" routerLinkActive="is-active" (click)="onNavClick()">Account</a>
      <!--
        Future enhancement: dark / light mode toggle (not working as expected yet).
        <button class="nav__mode btn btn--ghost" type="button" (click)="toggleColorMode()">
          {{ isDarkMode ? 'Light' : 'Dark' }}
        </button>
        <button
          class="nav__mode-icon"
          type="button"
          (click)="toggleColorMode()"
          [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
          [title]="isDarkMode ? 'Light mode' : 'Dark mode'"
        >
          <app-nb-icon class="nav__mode-glyph" [class.is-visible]="!isDarkMode" name="moon"></app-nb-icon>
          <app-nb-icon class="nav__mode-glyph" [class.is-visible]="isDarkMode" name="sun"></app-nb-icon>
        </button>
      -->
      <button class="nav__logout" type="button" (click)="logout()">Sign out</button>
    </nav>
  </div>
</header>
