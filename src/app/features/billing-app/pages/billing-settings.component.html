<section class="page">
  <ng-container *ngIf="loading; else ready">
    <app-billing-panel-shimmer variant="settings"></app-billing-panel-shimmer>
  </ng-container>
  <ng-template #ready>
    <header class="head">
      <div>
        <p class="kicker">Merchant desk</p>
        <h2>Billing settings</h2>
      </div>
      <button type="button" class="save" (click)="save()" [disabled]="saving">
        {{ saving ? 'Saving…' : 'Save settings' }}
      </button>
    </header>

    <div class="grid">
      <article class="panel">
        <h3>Merchant identity</h3>
        <label>
          Merchant name
          <input [(ngModel)]="draft.merchantName" />
        </label>
        <label>
          Support note
          <textarea rows="3" [(ngModel)]="draft.supportNote"></textarea>
        </label>
        <label>
          UPI VPA
          <input [(ngModel)]="draft.upiVpa" />
        </label>
        <label>
          Card label
          <input [(ngModel)]="draft.cardLabel" />
        </label>
      </article>

      <article class="panel">
        <h3>Payment methods</h3>
        <p class="hint">Toggle rails available at checkout. Icons stay small and clear.</p>
        <div class="methods">
          <button
            type="button"
            class="method"
            [class.on]="draft.methods.cash"
            (click)="draft.methods.cash = !draft.methods.cash"
          >
            <span class="method__icon method__icon--cash" aria-hidden="true">
              <span class="cash-bill"></span>
              <span class="cash-bill cash-bill--front"></span>
            </span>
            <span class="method__meta">
              <strong>Cash</strong>
              <small>{{ draft.methods.cash ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
          <button
            type="button"
            class="method"
            [class.on]="draft.methods.card"
            (click)="draft.methods.card = !draft.methods.card"
          >
            <span class="method__icon method__icon--card" aria-hidden="true">
              <span class="card-body">
                <span class="card-stripe"></span>
                <span class="card-chip"></span>
              </span>
            </span>
            <span class="method__meta">
              <strong>Card</strong>
              <small>{{ draft.methods.card ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
          <button
            type="button"
            class="method"
            [class.on]="draft.methods.upi"
            (click)="draft.methods.upi = !draft.methods.upi"
          >
            <span class="method__icon method__icon--upi" aria-hidden="true">
              <span class="upi-mark">UPI</span>
            </span>
            <span class="method__meta">
              <strong>UPI</strong>
              <small>{{ draft.methods.upi ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
          <button
            type="button"
            class="method"
            [class.on]="draft.methods.qr"
            (click)="draft.methods.qr = !draft.methods.qr"
          >
            <span class="method__icon method__icon--qr" aria-hidden="true">
              <span class="qr-mark"></span>
            </span>
            <span class="method__meta">
              <strong>QR</strong>
              <small>{{ draft.methods.qr ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
        </div>
      </article>
    </div>
  </ng-template>
</section>
