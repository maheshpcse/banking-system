<section class="bs-page fade-up">
  <app-billing-panel-shimmer *ngIf="pageLoading" variant="settings"></app-billing-panel-shimmer>

  <ng-container *ngIf="!pageLoading">
    <header class="hero">
      <p class="eyebrow">Gateway</p>
      <h2>Billing settings</h2>
      <p class="lede">Merchant identity on the left · themed payment rails on the right.</p>
    </header>

    <form class="settings" [formGroup]="form" (ngSubmit)="save()">
      <div class="glass col">
        <h3>Merchant identity</h3>
        <label>
          Merchant name
          <input class="input" formControlName="merchantName" />
        </label>
        <label>
          Support note
          <textarea class="input input--area" rows="4" formControlName="supportNote"></textarea>
        </label>
        <div class="grid2">
          <label>
            UPI VPA
            <input class="input" formControlName="upiVpa" placeholder="merchant@upi" />
          </label>
          <label>
            Card label
            <input class="input" formControlName="cardLabel" />
          </label>
        </div>
      </div>

      <div class="glass col">
        <h3>Payment methods</h3>
        <p class="hint">Tap a themed option to enable or disable at POS checkout.</p>
        <div class="pay-themes">
          <button
            type="button"
            class="pay-theme pay-theme--cash"
            [class.is-on]="form.value.cash"
            (click)="toggleMethod('cash')"
          >
            <span class="pay-theme__art" aria-hidden="true">
              <span class="pay-theme__bill"></span>
              <span class="pay-theme__bill pay-theme__bill--b"></span>
            </span>
            <span class="pay-theme__meta">
              <strong>Cash</strong>
              <em>{{ form.value.cash ? 'Enabled' : 'Off' }}</em>
            </span>
          </button>
          <button
            type="button"
            class="pay-theme pay-theme--card"
            [class.is-on]="form.value.card"
            (click)="toggleMethod('card')"
          >
            <span class="pay-theme__art" aria-hidden="true">
              <span class="pay-theme__card-face"></span>
            </span>
            <span class="pay-theme__meta">
              <strong>Card</strong>
              <em>{{ form.value.card ? 'Enabled' : 'Off' }}</em>
            </span>
          </button>
          <button
            type="button"
            class="pay-theme pay-theme--upi"
            [class.is-on]="form.value.upi"
            (click)="toggleMethod('upi')"
          >
            <span class="pay-theme__art" aria-hidden="true">
              <span class="pay-theme__phone"></span>
            </span>
            <span class="pay-theme__meta">
              <strong>UPI</strong>
              <em>{{ form.value.upi ? 'Enabled' : 'Off' }}</em>
            </span>
          </button>
          <button
            type="button"
            class="pay-theme pay-theme--qr"
            [class.is-on]="form.value.qr"
            (click)="toggleMethod('qr')"
          >
            <span class="pay-theme__art" aria-hidden="true">
              <span class="pay-theme__qr"></span>
            </span>
            <span class="pay-theme__meta">
              <strong>QR</strong>
              <em>{{ form.value.qr ? 'Enabled' : 'Off' }}</em>
            </span>
          </button>
        </div>

        <div class="sr-only" aria-hidden="true">
          <input type="checkbox" formControlName="cash" />
          <input type="checkbox" formControlName="card" />
          <input type="checkbox" formControlName="upi" />
          <input type="checkbox" formControlName="qr" />
        </div>
      </div>

      <div class="settings__foot">
        <button type="submit" class="btn btn--primary" [disabled]="busy">
          {{ busy ? 'Saving…' : 'Save settings' }}
        </button>
      </div>
    </form>
  </ng-container>
</section>
