<section class="bs-page fade-up">
  <app-billing-panel-shimmer *ngIf="pageLoading" variant="settings"></app-billing-panel-shimmer>

  <ng-container *ngIf="!pageLoading">
    <header class="hero">
      <p class="eyebrow">Gateway</p>
      <h2>Billing settings</h2>
      <p class="lede">Merchant identity on the left · payment rails on the right.</p>
    </header>

    <form class="settings" [formGroup]="form" (ngSubmit)="save()">
      <div class="glass col">
        <h3>Merchant identity</h3>
        <label>
          Merchant name
          <input class="input" formControlName="merchantName" />
        </label>
        <label>
          Support note
          <textarea class="input input--area" rows="4" formControlName="supportNote"></textarea>
        </label>
        <div class="grid2">
          <label>
            UPI VPA
            <input class="input" formControlName="upiVpa" placeholder="merchant@upi" />
          </label>
          <label>
            Card label
            <input class="input" formControlName="cardLabel" />
          </label>
        </div>
      </div>

      <div class="glass col">
        <h3>Payment methods</h3>
        <p class="hint">Toggle rails available at checkout. Icons stay small and clear.</p>
        <div class="methods">
          <button
            type="button"
            class="method"
            [class.on]="form.value.cash"
            (click)="toggleMethod('cash')"
          >
            <span class="method__icon method__icon--cash" aria-hidden="true">
              <span class="cash-bill"></span>
              <span class="cash-bill cash-bill--front"></span>
            </span>
            <span class="method__meta">
              <strong>Cash</strong>
              <small>{{ form.value.cash ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
          <button
            type="button"
            class="method"
            [class.on]="form.value.card"
            (click)="toggleMethod('card')"
          >
            <span class="method__icon method__icon--card" aria-hidden="true">
              <span class="card-body">
                <span class="card-stripe"></span>
                <span class="card-chip"></span>
              </span>
            </span>
            <span class="method__meta">
              <strong>Card</strong>
              <small>{{ form.value.card ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
          <button
            type="button"
            class="method"
            [class.on]="form.value.upi"
            (click)="toggleMethod('upi')"
          >
            <span class="method__icon method__icon--upi" aria-hidden="true">
              <span class="upi-mark">UPI</span>
            </span>
            <span class="method__meta">
              <strong>UPI</strong>
              <small>{{ form.value.upi ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
          <button
            type="button"
            class="method"
            [class.on]="form.value.qr"
            (click)="toggleMethod('qr')"
          >
            <span class="method__icon method__icon--qr" aria-hidden="true">
              <span class="qr-mark"></span>
            </span>
            <span class="method__meta">
              <strong>QR</strong>
              <small>{{ form.value.qr ? 'Enabled' : 'Off' }}</small>
            </span>
          </button>
        </div>

        <div class="sr-only" aria-hidden="true">
          <input type="checkbox" formControlName="cash" />
          <input type="checkbox" formControlName="card" />
          <input type="checkbox" formControlName="upi" />
          <input type="checkbox" formControlName="qr" />
        </div>
      </div>

      <div class="settings__foot">
        <button type="submit" class="btn btn--primary" [disabled]="busy">
          {{ busy ? 'Saving…' : 'Save settings' }}
        </button>
      </div>
    </form>
  </ng-container>
</section>
