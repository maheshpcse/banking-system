<section class="bs-page fade-up">
  <app-billing-panel-shimmer *ngIf="pageLoading" variant="settings"></app-billing-panel-shimmer>

  <ng-container *ngIf="!pageLoading">
    <header class="hero">
      <p class="eyebrow">Gateway</p>
      <h2>Billing settings</h2>
      <p class="lede">Merchant identity on the left · payment rails styled like ATM card faces on the right.</p>
    </header>

    <form class="settings" [formGroup]="form" (ngSubmit)="save()">
      <div class="glass col">
        <h3>Merchant identity</h3>
        <label>
          Merchant name
          <input class="input" formControlName="merchantName" />
        </label>
        <label>
          Support note
          <textarea class="input input--area" rows="4" formControlName="supportNote"></textarea>
        </label>
        <div class="grid2">
          <label>
            UPI VPA
            <input class="input" formControlName="upiVpa" placeholder="merchant@upi" />
          </label>
          <label>
            Card label
            <input class="input" formControlName="cardLabel" />
          </label>
        </div>
      </div>

      <div class="glass col">
        <h3>Payment methods</h3>
        <p class="hint">Tap a card face to enable or disable at POS checkout.</p>
        <div class="pay-faces">
          <button
            type="button"
            class="pay-face pay-face--cash"
            [class.is-on]="form.value.cash"
            (click)="toggleMethod('cash')"
          >
            <span class="pay-face__chip" aria-hidden="true"></span>
            <span class="pay-face__brand">Cash</span>
            <strong class="pay-face__status">{{ form.value.cash ? 'Enabled' : 'Off' }}</strong>
            <span class="pay-face__mark" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="pay-face pay-face--card"
            [class.is-on]="form.value.card"
            (click)="toggleMethod('card')"
          >
            <span class="pay-face__chip" aria-hidden="true"></span>
            <span class="pay-face__brand">Card</span>
            <strong class="pay-face__status">{{ form.value.card ? 'Enabled' : 'Off' }}</strong>
            <span class="pay-face__mark" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="pay-face pay-face--upi"
            [class.is-on]="form.value.upi"
            (click)="toggleMethod('upi')"
          >
            <span class="pay-face__chip" aria-hidden="true"></span>
            <span class="pay-face__brand">UPI</span>
            <strong class="pay-face__status">{{ form.value.upi ? 'Enabled' : 'Off' }}</strong>
            <span class="pay-face__mark" aria-hidden="true"></span>
          </button>
          <button
            type="button"
            class="pay-face pay-face--qr"
            [class.is-on]="form.value.qr"
            (click)="toggleMethod('qr')"
          >
            <span class="pay-face__chip" aria-hidden="true"></span>
            <span class="pay-face__brand">QR</span>
            <strong class="pay-face__status">{{ form.value.qr ? 'Enabled' : 'Off' }}</strong>
            <span class="pay-face__mark" aria-hidden="true"></span>
          </button>
        </div>

        <div class="sr-only" aria-hidden="true">
          <input type="checkbox" formControlName="cash" />
          <input type="checkbox" formControlName="card" />
          <input type="checkbox" formControlName="upi" />
          <input type="checkbox" formControlName="qr" />
        </div>
      </div>

      <div class="settings__foot">
        <button type="submit" class="btn btn--primary" [disabled]="busy">
          {{ busy ? 'Saving…' : 'Save settings' }}
        </button>
      </div>
    </form>
  </ng-container>
</section>
