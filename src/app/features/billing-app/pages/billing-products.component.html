<section class="page fade-up">
  <header class="page__head">
    <div>
      <p class="eyebrow">Catalog</p>
      <h2>Products</h2>
      <p class="lede">Search stock, edit pricing, and archive quiet SKUs.</p>
    </div>
  </header>

  <div class="toolbar">
    <input
      type="search"
      class="input"
      placeholder="Search name or SKU"
      [(ngModel)]="query"
      (keyup.enter)="search()"
    />
    <button type="button" class="btn btn--ghost" (click)="search()">Search</button>
  </div>

  <app-billing-panel-shimmer *ngIf="pageLoading" variant="list"></app-billing-panel-shimmer>

  <div class="layout" *ngIf="!pageLoading">
    <div class="panel">
      <div class="empty" *ngIf="!products.length">No products match this search.</div>
      <ul class="list" *ngIf="products.length">
        <li *ngFor="let p of products">
          <button type="button" class="row" (click)="edit(p)">
            <span [class]="stockTone(p.stock)" aria-hidden="true"></span>
            <div class="row__body">
              <strong>{{ p.name }}</strong>
              <span>{{ p.sku || 'No SKU' }} · stock {{ p.stock }}</span>
            </div>
            <em>{{ p.price | currencyFormat }}</em>
          </button>
          <button type="button" class="link-danger" [disabled]="busy" (click)="archive(p)">Archive</button>
        </li>
      </ul>
    </div>

    <form class="panel form" [formGroup]="form" (ngSubmit)="save()">
      <h3>{{ editingId ? 'Edit product' : 'Add product' }}</h3>
      <label>
        Name
        <input class="input" formControlName="name" />
      </label>
      <label>
        SKU
        <input class="input" formControlName="sku" />
      </label>
      <div class="grid2">
        <label>
          Price
          <input class="input" type="number" formControlName="price" />
        </label>
        <label>
          Stock
          <input class="input" type="number" formControlName="stock" />
        </label>
      </div>
      <label>
        GST %
        <input class="input" type="number" formControlName="gstPercentage" />
      </label>
      <div class="form__actions">
        <button type="button" class="btn btn--ghost" *ngIf="editingId" (click)="cancelEdit()">Cancel</button>
        <button type="submit" class="btn btn--primary" [disabled]="busy">
          {{ busy ? 'Saving…' : editingId ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</section>
