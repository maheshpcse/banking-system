<div class="bs-shell" [class.is-rail-collapsed]="railCollapsed">
  <aside class="bs-rail" aria-label="Billing navigation">
    <div class="bs-rail__brand">
      <span class="bs-rail__mark" aria-hidden="true"></span>
      <div class="bs-rail__brand-copy" *ngIf="!railCollapsed">
        <p class="bs-rail__eyebrow">NovaBill</p>
        <strong>Billing System</strong>
      </div>
      <button
        type="button"
        class="bs-rail__toggle"
        (click)="toggleRail()"
        [attr.aria-expanded]="!railCollapsed"
        [attr.aria-label]="railCollapsed ? 'Expand side menu' : 'Collapse side menu'"
        [title]="railCollapsed ? 'Expand menu' : 'Collapse menu'"
      >
        <svg class="bs-rail__toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="3"
            y="4"
            width="7"
            height="16"
            rx="1.6"
            [attr.fill]="railCollapsed ? 'currentColor' : 'currentColor'"
            [attr.opacity]="railCollapsed ? 0.28 : 1"
          ></rect>
          <rect x="12" y="4" width="9" height="16" rx="1.6" fill="currentColor"></rect>
          <polyline
            [attr.points]="railCollapsed ? '14.8,9.5 18,12 14.8,14.5' : '9.2,9.5 6,12 9.2,14.5'"
            fill="none"
            stroke="#ff9932"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></polyline>
        </svg>
      </button>
    </div>

    <nav class="bs-rail__nav">
      <a
        *ngFor="let item of dockItems"
        class="bs-rail__item"
        [routerLink]="item.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: item.path === '/billing' }"
        [attr.title]="item.label"
      >
        <span class="bs-rail__icon" [attr.data-icon]="item.icon" aria-hidden="true"></span>
        <span class="bs-rail__label" *ngIf="!railCollapsed">{{ item.label }}</span>
      </a>
    </nav>

    <div class="bs-rail__operator" [class.is-compact]="railCollapsed">
      <span class="bs-avatar" [ngClass]="'bs-avatar--' + avatarStyle" role="img" [attr.aria-label]="avatarInitials">
        <img *ngIf="avatarSrc as src" [src]="src" alt="" />
        <ng-container *ngIf="!avatarSrc">{{ avatarInitials }}</ng-container>
      </span>
      <div class="bs-rail__operator-copy" *ngIf="!railCollapsed">
        <strong>{{ operatorName }}</strong>
        <span>Manager desk</span>
      </div>
    </div>
  </aside>

  <div class="bs-workspace">
    <header class="bs-topbar">
      <div>
        <p class="bs-topbar__eyebrow">Store POS · Fake gateway ready</p>
        <h1 class="bs-topbar__title">Billing Portal</h1>
      </div>
      <div class="bs-topbar__actions">
        <span class="bs-avatar bs-avatar--lg" [ngClass]="'bs-avatar--' + avatarStyle" aria-hidden="true">
          <img *ngIf="avatarSrc as src" [src]="src" alt="" />
          <ng-container *ngIf="!avatarSrc">{{ avatarInitials }}</ng-container>
        </span>
        <a class="bs-link" [routerLink]="bankingReturnUrl">{{ bankingReturnLabel }}</a>
        <button type="button" class="bs-btn bs-btn--ghost" (click)="signOut()">Sign out</button>
      </div>
    </header>

    <main class="bs-main container-fluid" [class.is-fading]="contentFading">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
