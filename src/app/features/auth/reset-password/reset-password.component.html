<section class="auth-page auth-page--register" *ngIf="!loading; else authShimmer">
  <div class="auth-page__stage">
    <div class="auth-page__mesh" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--a" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--b" aria-hidden="true"></div>

    <div class="auth-page__copy">
      <p class="auth-page__brand">NovaBank</p>
      <h1>Choose a new password</h1>
      <p *ngIf="username || maskedEmail">
        Verified
        <strong *ngIf="username">@{{ username }}</strong>
        <span *ngIf="username && maskedEmail"> · </span>
        <span *ngIf="maskedEmail">{{ maskedEmail }}</span>
      </p>
    </div>

    <app-animated-card class="auth-panel" title="Reset password" subtitle="Step 2" accent="mint" [tilt]="false">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>New password</span>
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="Min. 8 characters" />
        </label>
        <label>
          <span>Confirm password</span>
          <input
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            placeholder="Repeat new password"
          />
        </label>

        <p class="form__error" *ngIf="form.hasError('mismatch') && form.touched">
          Passwords do not match.
        </p>
        <p class="form__error" *ngIf="formError">{{ formError }}</p>
        <p class="form__success" *ngIf="formSuccess">{{ formSuccess }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          Save new password
        </button>
      </form>

      <p class="auth-switch">
        <a routerLink="/auth/forgot-password">Verify a different account</a>
      </p>
    </app-animated-card>
  </div>
</section>

<ng-template #authShimmer>
  <app-shimmer variant="auth"></app-shimmer>
</ng-template>
