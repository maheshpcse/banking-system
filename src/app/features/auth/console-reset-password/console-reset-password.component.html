<section class="console-auth" *ngIf="!pageLoading; else consoleShimmer">
  <div class="console-auth__stage">
    <div class="console-auth__grid" aria-hidden="true"></div>
    <div class="console-auth__glow" aria-hidden="true"></div>

    <div class="console-auth__copy">
      <p class="console-auth__brand">Apex Console</p>
      <h1>Choose a new password</h1>
      <p *ngIf="username || maskedEmail">
        Verified
        <strong *ngIf="username">@{{ username }}</strong>
        <span *ngIf="username && maskedEmail"> · </span>
        <span *ngIf="maskedEmail">{{ maskedEmail }}</span>
      </p>
    </div>

    <div class="console-panel">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>New password</span>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Min. 8 characters"
            />
            <button
              type="button"
              class="password-field__toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <ng-container *ngIf="!showPassword; else hideIconA">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </ng-container>
                <ng-template #hideIconA>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path>
                  <path d="M1 1l22 22"></path>
                </ng-template>
              </svg>
            </button>
          </div>
          <p class="form__field-error" *ngIf="fieldError(form.controls.password, 'New password') as msg">{{ msg }}</p>
        </label>
        <label>
          <span>Confirm password</span>
          <div class="password-field">
            <input
              [type]="showConfirm ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Repeat new password"
            />
            <button
              type="button"
              class="password-field__toggle"
              (click)="showConfirm = !showConfirm"
              [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <ng-container *ngIf="!showConfirm; else hideIconB">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </ng-container>
                <ng-template #hideIconB>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path>
                  <path d="M1 1l22 22"></path>
                </ng-template>
              </svg>
            </button>
          </div>
          <p class="form__field-error" *ngIf="fieldError(form.controls.confirmPassword, 'Confirm password') as msg">
            {{ msg }}
          </p>
        </label>

        <p class="form__error" *ngIf="form.hasError('mismatch') && form.touched">
          Passwords do not match.
        </p>
        <p class="form__error" *ngIf="formError">{{ formError }}</p>
        <p class="form__success" *ngIf="formSuccess">{{ formSuccess }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          {{ loading ? 'Saving…' : 'Save new password' }}
        </button>
      </form>

      <p class="console-switch">
        <a routerLink="/auth/console/forgot-password">Verify a different account</a>
      </p>
    </div>
  </div>
</section>

<ng-template #consoleShimmer>
  <app-shimmer variant="auth" panel="reset"></app-shimmer>
</ng-template>
