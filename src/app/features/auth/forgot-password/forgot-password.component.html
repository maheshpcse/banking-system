<section class="auth-page auth-page--login" *ngIf="!pageLoading; else authShimmer">
  <div class="auth-page__stage">
    <div class="auth-page__mesh" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--a" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--b" aria-hidden="true"></div>

    <div class="auth-page__copy">
      <p class="auth-page__brand">NovaBank</p>
      <h1>Forgot password</h1>
      <p>Verify your username or email, then choose a new password.</p>
    </div>

    <app-animated-card class="auth-panel" title="Verify account" subtitle="Step 1" accent="sky" [tilt]="false">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Username or email</span>
          <input
            type="text"
            formControlName="identifier"
            autocomplete="username"
            placeholder="alex or you@email.com"
          />
          <p class="form__field-error" *ngIf="fieldError(form.controls.identifier, 'Username or email') as msg">
            {{ msg }}
          </p>
        </label>

        <p class="form__error" *ngIf="formError">{{ formError }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          {{ loading ? 'Verifying…' : 'Verify & continue' }}
        </button>
      </form>

      <p class="auth-switch">
        Remembered it?
        <a routerLink="/auth/login">Back to sign in</a>
      </p>
    </app-animated-card>
  </div>
</section>

<ng-template #authShimmer>
  <app-shimmer variant="auth" panel="forgot"></app-shimmer>
</ng-template>
