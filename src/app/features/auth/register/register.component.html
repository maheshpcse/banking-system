<section class="auth-page auth-page--register" *ngIf="!pageLoading; else authShimmer">
  <div class="auth-page__stage">
    <div class="auth-page__mesh" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--a" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--b" aria-hidden="true"></div>

    <div class="auth-page__copy">
      <p class="auth-page__brand">NovaBank</p>
      <h1>Open your account</h1>
      <p>Create credentials now — then sign in when you are ready.</p>
    </div>

    <app-animated-card class="auth-panel" title="Join NovaBank" subtitle="Register" accent="mint" [tilt]="false">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Full name</span>
          <input type="text" formControlName="fullName" autocomplete="name" placeholder="Alex Rivera" />
          <p class="form__field-error" *ngIf="fieldError(form.controls.fullName, 'Full name') as msg">{{ msg }}</p>
        </label>
        <label>
          <span>Username</span>
          <input
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="alex.rivera"
          />
          <p class="form__field-error" *ngIf="fieldError(form.controls.username, 'Username') as msg">{{ msg }}</p>
        </label>
        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@email.com" />
          <p class="form__field-error" *ngIf="fieldError(form.controls.email, 'Email') as msg">{{ msg }}</p>
        </label>
        <label>
          <span>Password</span>
          <div class="password-field">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Min. 8 characters"
            />
            <button
              type="button"
              class="password-field__toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <ng-container *ngIf="!showPassword; else hideIcon">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </ng-container>
                <ng-template #hideIcon>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <path d="M14.12 14.12a3 3 0 0 1-4.24-4.24"></path>
                  <path d="M1 1l22 22"></path>
                </ng-template>
              </svg>
            </button>
          </div>
          <p class="form__field-error" *ngIf="fieldError(form.controls.password, 'Password') as msg">{{ msg }}</p>
        </label>

        <p class="form__error" *ngIf="formError">{{ formError }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          {{ loading ? 'Creating…' : 'Create account' }}
        </button>
      </form>

      <p class="auth-switch">
        Already banking with us?
        <a routerLink="/auth/login">Sign in</a>
      </p>
      <p class="auth-switch auth-switch--home">
        <a routerLink="/">Back to home</a>
      </p>
    </app-animated-card>

    <p class="auth-footnote">
      Bank staff?
      <a routerLink="/auth/staff-signup">Request manager/admin access</a>
      ·
      <a routerLink="/auth/staff-status">Check status</a>
    </p>
  </div>
</section>

<ng-template #authShimmer>
  <app-shimmer variant="auth" panel="register"></app-shimmer>
</ng-template>
