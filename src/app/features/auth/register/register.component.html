<section class="auth-page auth-page--register" *ngIf="!loading; else authShimmer">
  <div class="auth-page__stage">
    <div class="auth-page__mesh" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--a" aria-hidden="true"></div>
    <div class="auth-page__band auth-page__band--b" aria-hidden="true"></div>

    <div class="auth-page__copy">
      <p class="auth-page__brand">NovaBank</p>
      <h1>Open your account</h1>
      <p>Create credentials now — then sign in when you are ready.</p>
    </div>

    <app-animated-card class="auth-panel" title="Join NovaBank" subtitle="Register" accent="mint" [tilt]="false">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Full name</span>
          <input type="text" formControlName="fullName" autocomplete="name" placeholder="Alex Rivera" />
        </label>
        <label>
          <span>Username</span>
          <input
            type="text"
            formControlName="username"
            autocomplete="username"
            placeholder="alex.rivera"
          />
        </label>
        <p class="form__hint" *ngIf="form.controls.username.touched && form.controls.username.invalid">
          3–32 characters: letters, numbers, dots, underscores, hyphens.
        </p>
        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@email.com" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="Min. 8 characters" />
        </label>

        <p class="form__error" *ngIf="formError">{{ formError }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          Create account
        </button>
      </form>

      <p class="auth-switch">
        Already banking with us?
        <a routerLink="/auth/login">Sign in</a>
      </p>
      <p class="auth-switch auth-switch--home">
        <a routerLink="/">Back to home</a>
      </p>
    </app-animated-card>
  </div>
</section>

<ng-template #authShimmer>
  <app-shimmer variant="auth"></app-shimmer>
</ng-template>
