<section class="console-auth" *ngIf="!pageLoading; else consoleShimmer">
  <div class="console-auth__stage">
    <div class="console-auth__grid" aria-hidden="true"></div>
    <div class="console-auth__glow" aria-hidden="true"></div>

    <div class="console-auth__copy">
      <p class="console-auth__brand">Apex Console</p>
      <h1>Reset your password</h1>
      <p>Confirm your Super Admin username or email to continue.</p>
    </div>

    <div class="console-panel">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Username or email</span>
          <input type="text" formControlName="identifier" autocomplete="username" placeholder="root or you@apex.io" />
          <p class="form__field-error" *ngIf="fieldError(form.controls.identifier, 'Username or email') as msg">
            {{ msg }}
          </p>
        </label>

        <p class="form__error" *ngIf="formError">{{ formError }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          {{ loading ? 'Verifying…' : 'Continue' }}
        </button>
      </form>

      <p class="console-switch">
        <a routerLink="/auth/console/login">Back to Console sign-in</a>
      </p>
    </div>
  </div>
</section>

<ng-template #consoleShimmer>
  <section class="console-auth console-auth--shimmer" aria-hidden="true">
    <div class="console-auth__stage">
      <div class="console-auth__grid"></div>
      <div class="console-auth__glow"></div>

      <div class="console-auth__copy console-auth__copy--shimmer">
        <span class="sa-bone sa-bone--brand"></span>
        <span class="sa-bone sa-bone--title"></span>
        <span class="sa-bone sa-bone--lede"></span>
      </div>

      <div class="console-panel console-panel--shimmer">
        <span class="sa-bone sa-bone--label"></span>
        <span class="sa-bone sa-bone--field"></span>
        <span class="sa-bone sa-bone--btn"></span>
        <span class="sa-bone sa-bone--link"></span>
      </div>
    </div>
  </section>
</ng-template>
