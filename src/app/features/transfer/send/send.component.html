<section class="page" *ngIf="!pageLoading; else formShimmer">
  <header class="page__hero">
    <div>
      <p class="eyebrow">NovaBank</p>
      <h1>Send money</h1>
      <p class="lede">Transfer instantly to another NovaBank account number.</p>
    </div>
  </header>

  <div class="layout">
    <app-animated-card accent="sky" title="New transfer" subtitle="Secure">
      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Recipient account</span>
          <input type="text" formControlName="toAccountNumber" placeholder="MBxxxxxxxxxxxx" />
        </label>
        <label>
          <span>Amount</span>
          <input type="number" step="0.01" min="0.01" formControlName="amount" placeholder="0.00" />
        </label>
        <label>
          <span>Note (optional)</span>
          <input type="text" formControlName="description" placeholder="Rent, gift, shared dinner…" />
        </label>

        <button class="btn btn--primary" type="submit" [disabled]="loading">
          {{ loading ? 'Sending…' : 'Send transfer' }}
        </button>
      </form>
    </app-animated-card>

    <aside class="tips">
      <div class="tips__panel">
        <h2>How it works</h2>
        <ol>
          <li>Ask the recipient for their NovaBank account number.</li>
          <li>Enter the amount and an optional note.</li>
          <li>Funds move instantly between accounts.</li>
        </ol>
      </div>
    </aside>
  </div>
</section>

<ng-template #formShimmer>
  <app-shimmer variant="form"></app-shimmer>
</ng-template>
