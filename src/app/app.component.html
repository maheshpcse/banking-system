<div
  class="app-shell"
  [class.app-shell--marketing]="isMarketingSurface && !bootstrapping"
  [class.app-shell--has-nav]="hasStickyNav"
  [class.app-shell--billing]="isBillingSurface"
  [class.app-shell--console]="isConsoleSurface"
>
  <div class="ambient" *ngIf="showAmbient" aria-hidden="true">
    <div class="ambient__wash"></div>
    <div class="ambient__ledger"></div>
    <div class="ambient__flow ambient__flow--a"></div>
    <div class="ambient__flow ambient__flow--b"></div>
    <div class="ambient__flow ambient__flow--c"></div>
    <div class="ambient__coin ambient__coin--a"></div>
    <div class="ambient__coin ambient__coin--b"></div>
    <div class="ambient__coin ambient__coin--c"></div>
    <div class="ambient__sheen"></div>
  </div>
  <app-navbar *ngIf="!isBillingSurface && !isConsoleSurface && !isMarketingSurface"></app-navbar>
  <a
    *ngIf="isSaAccountSurface && !bootstrapping"
    class="sa-return"
    routerLink="/console"
  >← Apex Console</a>
  <main [class.main--billing]="isBillingSurface" [class.main--console]="isConsoleSurface">
    <!-- Console has its own page shimmers — skip root boot cards to avoid a double flash. -->
    <app-shimmer *ngIf="bootstrapping && !isConsoleSurface" [variant]="bootVariant"></app-shimmer>
    <div [hidden]="bootstrapping && !isConsoleSurface">
      <router-outlet></router-outlet>
    </div>
    <footer
      class="app-foot"
      *ngIf="!isBillingSurface && !isConsoleSurface && !isMarketingSurface && !bootstrapping"
    >
      <span class="app-foot__sig">
        <a class="app-foot__link" routerLink="/">NovaBank</a>
        <span aria-hidden="true"> · </span>
        <a class="app-foot__link" routerLink="/novabill">NovaBill</a>
      </span>
      <span class="app-foot__copy">
        © {{ year }}
        <a class="app-foot__link" routerLink="/">NovaBank</a>. All rights reserved.
      </span>
    </footer>
    <div class="app-foot app-foot--shimmer" *ngIf="!isBillingSurface && !isConsoleSurface && !isMarketingSurface && bootstrapping" aria-hidden="true">
      <span class="app-foot__bone"></span>
      <span class="app-foot__bone app-foot__bone--copy"></span>
    </div>
  </main>
  <app-portal-launch *ngIf="!isConsoleSurface"></app-portal-launch>
</div>
