<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NovaBank — Minimal Banking</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NovaBank — a minimal MEAN stack banking system with a light premium UI.">
  <meta name="theme-color" content="#5fc4b0">
  <!-- GitHub Pages SPA: restore deep-link path after 404.html bounce -->
  <script>
    (function () {
      try {
        var redirect = sessionStorage.getItem('nb-gh-redirect');
        if (redirect) {
          sessionStorage.removeItem('nb-gh-redirect');
          if (redirect !== location.href) {
            history.replaceState(null, '', redirect);
          }
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <!-- Offline fonts: static CSS under assets (relative urls, base-href safe) -->
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <!-- Offline favicons (relative to base href — works on /banking-system/) -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icons/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="shortcut icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
</head>
<body>
  <app-root></app-root>
</body>
</html>
