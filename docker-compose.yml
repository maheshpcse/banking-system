services:
  mongo:
    image: mongo:7
    container_name: banking-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - banking_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: banking-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      USE_MEMORY_DB: "false"
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB_NAME:-banking_system}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CLIENT_ORIGIN: http://localhost:${CLIENT_PORT:-8080}
    ports:
      - "${SERVER_PORT:-3000}:3000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: banking-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  banking_mongo_data:
