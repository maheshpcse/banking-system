name: Banking UI Deployment CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: banking-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-build:
    name: Build Angular client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --configuration production --base-href=/banking-system/

      - name: Docker build smoke test
        run: docker build -t banking-client:ci .

  compose-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: [client-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config
