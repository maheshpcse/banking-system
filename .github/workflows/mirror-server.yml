name: Mirror backend to banking-system-server

# One-shot helper to publish the extracted Express API into
# https://github.com/maheshpcse/banking-system-server
#
# Required repo secret on maheshpcse/banking-system:
#   BANKING_SYSTEM_SERVER_PUSH_TOKEN
#     - classic PAT with `repo` scope, OR
#     - fine-grained PAT with Contents: Read and write on banking-system-server
#
# Run: Actions → "Mirror backend to banking-system-server" → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Push server export to banking-system-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server export branch
        uses: actions/checkout@v4
        with:
          ref: cursor/server-export-cb7f
          fetch-depth: 0

      - name: Verify push token secret
        env:
          TOKEN: ${{ secrets.BANKING_SYSTEM_SERVER_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing secret BANKING_SYSTEM_SERVER_PUSH_TOKEN on this repository."
            echo "Add a GitHub PAT with write access to maheshpcse/banking-system-server,"
            echo "then re-run this workflow."
            exit 1
          fi

      - name: Push to banking-system-server main
        env:
          TOKEN: ${{ secrets.BANKING_SYSTEM_SERVER_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git checkout -B main
          git remote remove server 2>/dev/null || true
          git remote add server "https://x-access-token:${TOKEN}@github.com/maheshpcse/banking-system-server.git"
          git push -u server main --force
          echo "Mirrored cursor/server-export-cb7f → maheshpcse/banking-system-server:main"
